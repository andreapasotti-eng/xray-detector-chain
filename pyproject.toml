[project]
name = "xray-detector-chain"
version = "0.1.0"
description = "X-ray detector processing chain: calibration, 16-bit filtering and image quality metrics"
readme = "README.md"
authors = [
    { name = "Andrea Pasotti", email = "andreapasotti.eng@protonmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    "tifffile>=2026.9.20",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
